<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Mirror</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=Shadows+Into+Light&display=swap" rel="stylesheet">

<style>
    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f8f7f2;
        color: #1e293b;
    }

    .handwritten {
        font-family: 'Shadows Into Light', cursive;
    }

    .sketch-card {
        background: white;
        border: 2px solid #1e293b;
        box-shadow: 4px 4px 0px #1e293b;
        border-radius: 4px;
    }

    .mode-card {
        border: 2px solid #1e293b;
        padding: 30px;
        border-radius: 6px;
        cursor: pointer;
        transition: 0.2s ease;
    }

    .mode-card:hover {
        background: #1e293b;
        color: white;
        transform: translateY(-4px);
        box-shadow: 4px 4px 0px #1e293b;
    }
</style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-3xl text-center">

    <!-- Title -->
    <h1 class="text-5xl font-extrabold uppercase italic">Digital Mirror.</h1>
    <p class="handwritten text-2xl text-indigo-600 mt-2 mb-10">
        How do you look to the world?
    </p>

    <!-- Selection Box -->
    <div class="sketch-card p-8">

        <h2 class="text-lg font-bold uppercase mb-8">
            Select Analysis Mode
        </h2>

        <div class="grid md:grid-cols-2 gap-6">

            <!-- TEXT ANALYZER -->
            <div class="mode-card"
                onclick="location.href='index(2).html'">

                <h3 class="font-extrabold text-lg mb-2">
                    Profile Analysis
                </h3>

                <p class="text-sm opacity-80">
                    Analyze username, bio and captions for professionalism,
                    creativity and uniqueness.
                </p>
            </div>

            <!-- SCREENSHOT ANALYZER -->
            <div class="mode-card"
                onclick="location.href='indexai.html'">

                <h3 class="font-extrabold text-lg mb-2">
                    Screenshot Analysis ( Upload Screenshot )
                </h3>

                <p class="text-sm opacity-80">
                    Upload LinkedIn / Social Media screenshot and extract
                    insights automatically.
                </p>
            </div>

        </div>

    </div>
</div>

</body>
</html>
